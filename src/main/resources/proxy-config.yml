# ================================================================
#  VTRegister — прокси-модуль (Velocity / BungeeCord / Waterfall)
# ================================================================
# Этот же jar кладётся и на прокси, и на Paper-серверы.
# На Paper-сервере — регистрация, пароли, антибот-проверка.
# На прокси — только то, что сервер сделать не может:
#   * до входа нельзя сменить сервер (/server, фолбэк, чужие плагины);
#   * до входа блокируются прокси-команды (/server, /glist, /msg прокси...);
#   * после входа — отправка на игровой сервер;
#   * лимиты подключений по настоящим IP и режим атаки ботов.
# Как подключить — PROXY_SETUP.txt внутри jar / README.
# Этот файл: Velocity — plugins/vtregister/config.yml,
# BungeeCord/Waterfall — plugins/VTRegister/config.yml.

# Серверы (имена из velocity.toml / config.yml прокси), где стоит VTRegister
# и где игрок вводит пароль. Первый подключившийся игрок, пока не вошёл,
# всегда попадает на первый доступный сервер из списка.
# Пустой список [] = вход на любом сервере, но смена сервера до входа запрещена.
# Имени нет среди серверов прокси? Игрока НЕ кикаем (идёт куда шлёт прокси),
# а в консоль раз в минуту пишется предупреждение, пока не исправишь.
auth_servers: [auth]

# Куда отправить после входа. Список — берётся первый, куда удалось
# подключиться. [] = остаться на сервере входа.
# ВАЖНО: если используешь это — выключи proxy_server.enabled на Paper-сервере,
# иначе игрока отправят дважды.
after_login_server: []

# Прокси-команды, разрешённые ДО входа (без '/'). Остальные прокси-команды
# блокируются. Команды сервера (/login, /register) это не затрагивает.
allowed_proxy_commands: []

# Общий секрет с Paper-серверами (security.proxy_bridge.secret в их config.yml).
# Задай одинаковую длинную случайную строку на прокси и на всех серверах —
# тогда вход на одном сервере с VTRegister засчитывается на остальных.
# Пусто = каждый сервер с VTRegister спрашивает пароль сам.
secret: ''

# Лимиты по IP. Если перед прокси стоит HAProxy/TCPShield БЕЗ PROXY protocol
# (haproxy-protocol / proxy_protocol), у всех игроков один IP — поставь
# per_ip_per_minute: 0 и max_online_per_ip: 0.
# Раз в минуту писать в консоль, если auth_servers/after_login_server указывают
# на несуществующие серверы. false — не напоминать.
warn_misconfigured: true

connection_limit:
  # Подключений с одного IP в минуту (0 = без лимита). Проверенные IP не считаются.
  per_ip_per_minute: 8
  # Одновременно в сети с одного IP (0 = без лимита)
  max_online_per_ip: 4
  # Больше подключений в секунду на весь прокси = атака ботов (0 = выкл)
  global_per_second: 25
  # Сколько секунд длится режим атаки: пускаем только проверенные IP
  attack_seconds: 120
  # Сколько часов IP считается проверенным после успешного входа
  verified_ip_hours: 72
  # Во время атаки незнакомых IP пускаем столько в секунду (проверенные — без
  # очереди). 0 — во время атаки пускать только проверенные IP
  attack_admit_per_second: 2

# Проверка пинга: настоящий клиент сначала видит сервер в списке серверов
# (пинг), бот обычно подключается сразу. off — выкл; attack — только во время
# атаки (рекомендуется); always — всегда (новые игроки без пинга получат
# просьбу обновить список серверов и зайти снова).
ping_check:
  mode: attack
  window_seconds: 600       # сколько секунд пинг «действует»

# Тексты для игроков: & — цвета; перевод строки — два символа: обратный слеш и n
messages:
  ping_first: '&eДобавь сервер в список серверов, обнови список и зайди снова.'
  switch_denied: '&cСначала войди в аккаунт: &f/login <пароль>'
  command_denied: '&cЭта команда доступна после входа: &f/login <пароль>'
  no_auth_server: '&cСервер авторизации недоступен. Попробуй зайти через минуту.'
  attack: '&cСервер отражает атаку ботов.\n&fЗайди через пару минут — вернувшихся игроков пускаем сразу.'
  too_fast: '&cСлишком частые подключения с твоего IP. Подожди минуту.'
  too_many_online: '&cС твоего IP уже играет слишком много аккаунтов.'
