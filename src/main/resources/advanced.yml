# ============================================================================
#  VTRegister — ПРОДВИНУТЫЕ настройки
# ----------------------------------------------------------------------------
#  Этот файл нужен только большим серверам и сетям.
#  Новичкам сюда заходить не нужно — всё уже работает по умолчанию.
#
#  Что здесь можно:
#    • перенести базу аккаунтов в SQLite (меньше места, быстрее на больших базах)
#      или в MySQL / MariaDB / PostgreSQL (общая база для нескольких серверов);
#    • настроить пул соединений и SSL;
#    • тонко управлять лимитами и обслуживанием.
#
#  Значения по умолчанию: YAML-файл (как в версиях 1.0.x–1.1.x) — ничего
#  переносить не нужно, всё продолжит работать.
# ============================================================================

storage:
  # Тип хранилища:
  #   yaml       — файл data/accounts.yml (по умолчанию, человекочитаемый)
  #   sqlite     — файл data/accounts.db (компактнее и быстрее на больших базах)
  #   mysql      — база MySQL (общая для сети серверов)
  #   mariadb    — база MariaDB (используется драйвер MySQL)
  #   postgresql — база PostgreSQL (драйвер скачается автоматически)
  type: yaml

  # ── Параметры для SQL (игнорируются для yaml/sqlite) ──────────────────────
  host: "localhost"
  port: 3306                 # для PostgreSQL по умолчанию 5432
  database: "minecraft"  # имя базы
  user: "root"  # пользователь БД
  password: ""  # пароль БД
  ssl: false  # шифровать соединение с БД
  # Префикс таблицы (несколько серверов могут жить в одной базе)
  table_prefix: "rp_"
  # Размер пула соединений (1–16). Больше 8 обычно не нужно
  pool_size: 4
  # Имя файла SQLite
  sqlite_file: "accounts.db"
  # Искать аккаунт по нику, если UUID не совпал (смена online-mode, миграция
  # с другого ядра, смена ника у лицензионного игрока)
  match_by_name: true

# Обслуживание: как часто сбрасывать изменения аккаунтов на диск
maintenance:
  # Как часто сбрасывать изменённые аккаунты на диск/в базу (в тиках, 20 = 1 сек)
  flush_interval_ticks: 40
  # Писать в лог, если аккаунт читается из базы синхронно (может лагать)
  warn_sync_reads: false

# Лимиты нагрузки: хеширование паролей и письма
limits:
  # Максимум одновременных проверок пароля (защита CPU от флуда)
  max_parallel_hash_checks: 12
  # Максимум проверок пароля с одного IP одновременно
  max_parallel_per_ip: 2
  # Максимум писем в минуту (защита SMTP от флуда)
  max_emails_per_minute: 5

# Резервные копии базы аккаунтов
database_backup:
  # Автоматическая резервная копия при запуске (только для yaml/sqlite)
  enabled: false
  # Сколько последних копий хранить в data/backups/
  keep_last: 5

# ── Антибот: экспертные ручки (для продвинутых) ──────────────────────────────
# Обычному серверу трогать не нужно — значения по умолчанию подобраны.
antibot:
  # Период общего тикера антибота в тиках (20 = 1 сек). Меньше = точнее
  # таймауты и отсчёты, больше = дешевле на слабых серверах
  tick_ticks: 10
  # Пауза между рывками камеры на этапе SLOTS (тики). Короче = агрессивнее
  jolt_interval_ticks: 8
  # Окно подсчёта move-пакетов (тики тикера): пакеты суммируются за окно,
  # превышение packet_max_per_tick = бот. 1 = строго, 5 = толерантно к лагам
  packet_window_ticks: 3

# ── Автоматический перезапуск сервера ───────────────────────────────────────
# Долгая работа без перезапуска копит «мусор» у ядра и плагинов. По умолчанию:
# каждые 48 часов в 00:00 по Москве. Игроков заранее предупреждают в чате.
auto_restart:
  enabled: true
  # time   — в заданное время суток (time + timezone), раз в every_days дней
  # uptime — ровно через uptime_hours часов работы сервера
  mode: time
  time: "00:00"              # во сколько перезапускать (ЧЧ:ММ) — для mode: time
  # Часовой пояс: Europe/Moscow (МСК), Europe/Kyiv, Europe/Minsk, Europe/Berlin,
  # Asia/Almaty, Asia/Yekaterinburg, Asia/Novosibirsk, Asia/Vladivostok, UTC
  # или server — часовой пояс машины, где запущен сервер
  timezone: "Europe/Moscow"
  every_days: 2              # раз в N дней (2 = каждые 48 часов) — для mode: time
  uptime_hours: 48           # через сколько часов работы — для mode: uptime
  # За сколько секунд до перезапуска предупреждать в чате
  warn_seconds: [900, 600, 300, 120, 60, 30, 10, 5, 4, 3, 2, 1]
  warn_message: "&c⚠ Перезапуск сервера через &f{time}&c."
  kick_message: "&eСервер перезапускается. Зайди через минуту!"
  # restart — команда рестарта (spigot.yml → restart-script; без скрипта сервер
  # просто выключится, и хостинг обычно поднимает его сам); stop — выключить
  command: "restart"
