# ============================================================================
#  VTRegister — ПРОДВИНУТЫЕ настройки
# ----------------------------------------------------------------------------
#  Этот файл нужен только большим серверам и сетям.
#  Новичкам сюда заходить не нужно — всё уже работает по умолчанию.
#
#  Что здесь можно:
#    • перенести базу аккаунтов в SQLite (меньше места, быстрее на больших базах)
#      или в MySQL / MariaDB / PostgreSQL (общая база для нескольких серверов);
#    • настроить пул соединений и SSL;
#    • тонко управлять лимитами и обслуживанием.
#
#  Значения по умолчанию: YAML-файл (как в версиях 1.0.x–1.1.x) — ничего
#  переносить не нужно, всё продолжит работать.
# ============================================================================

storage:
  # Тип хранилища:
  #   yaml       — файл data/accounts.yml (по умолчанию, человекочитаемый)
  #   sqlite     — файл data/accounts.db (компактнее и быстрее на больших базах)
  #   mysql      — база MySQL (общая для сети серверов)
  #   mariadb    — база MariaDB (используется драйвер MySQL)
  #   postgresql — база PostgreSQL (драйвер скачается автоматически)
  type: yaml

  # ── Параметры для SQL (игнорируются для yaml/sqlite) ──────────────────────
  host: "localhost"
  port: 3306                 # для PostgreSQL по умолчанию 5432
  database: "minecraft"
  user: "root"
  password: ""
  ssl: false
  # Префикс таблицы (несколько серверов могут жить в одной базе)
  table_prefix: "rp_"
  # Размер пула соединений (1–16). Больше 8 обычно не нужно
  pool_size: 4
  # Имя файла SQLite
  sqlite_file: "accounts.db"
  # Искать аккаунт по нику, если UUID не совпал (смена online-mode, миграция
  # с другого ядра, смена ника у лицензионного игрока)
  match_by_name: true

maintenance:
  # Как часто сбрасывать изменённые аккаунты на диск/в базу (в тиках, 20 = 1 сек)
  flush_interval_ticks: 40
  # Писать в лог, если аккаунт читается из базы синхронно (может лагать)
  warn_sync_reads: false

limits:
  # Максимум одновременных проверок пароля (защита CPU от флуда)
  max_parallel_hash_checks: 12
  # Максимум проверок пароля с одного IP одновременно
  max_parallel_per_ip: 2
  # Максимум писем в минуту (защита SMTP от флуда)
  max_emails_per_minute: 5

database_backup:
  # Автоматическая резервная копия при запуске (только для yaml/sqlite)
  enabled: false
  # Сколько последних копий хранить в data/backups/
  keep_last: 5
