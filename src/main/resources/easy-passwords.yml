# ============================================================
#  Разрешённые «лёгкие» пароли
# ============================================================
#  Работает только если в config.yml включено:
#    password.allow_easy_passwords: true
#
#  Пароли из этого списка будут ПРИНИМАТЬСЯ при регистрации,
#  даже если они короче password.min_length или не проходят
#  проверку сложности (password.enforce_strength).
#
#  Пиши каждый пароль с новой строки после дефиса.
#  Пароль чувствителен к регистру (qwerty и QWERTY — разные).
# ============================================================

allowed:
  # Примеры (раскомментируй или добавь свои):
  # - "qwerty123"
  # - "12345"
  # - "minecraft"
