  antibot_click_wrong: "{prefix}&#FF6666Invalid confirmation link. Click the message above."
  antibot_wait: "{prefix}&#FF6666Complete the bot check first — follow the chat instructions"
  antibot_passed: "{prefix}&#A0FFA0Bot check passed!"
