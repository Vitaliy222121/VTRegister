# ============================================================
#  VTRegister — English messages
# ============================================================
#  Colors: &#RRGGBB (HEX), &a &c &l (vanilla codes).
#  Placeholders: {prefix} {player} {code} {seconds} {stage_num}
#                {stage_total} {slots} {blocks} {position} {target} {kind}
#
#  Priority: config.yml -> messages.<key> overrides these values.
#  Entries marked "DO NOT REMOVE" have a built-in fallback in code:
#  the player always sees the security warning even if you delete them.
# ============================================================

messages:
  # ---------- auth mode (DO NOT REMOVE) ----------
  auth_mode_secure: "{prefix}&#A0FFA0Auth mode: PROTECTED &#7F7F7F— password is typed in chat and never logged"
  auth_mode_insecure: "{prefix}&#FF6666Auth mode: UNPROTECTED &#7F7F7F— password goes through a command and IS visible in console/logs!"

  # ---------- password-in-command warnings (DO NOT REMOVE) ----------
  insecure_mode_warn: "{prefix}&#FF6666WARNING: protected mode is off — a password in a command is visible in the server console and logs!"
  insecure_blocked_warn: "{prefix}&#FF5555&lPASSWORD BLOCKED! &#FFFFFFYour message was not sent. &#7F7F7FWhen you type a password as a command argument it lands in the console and logs, and the server owner can read it."
  insecure_repeat_hint: "{prefix}&#FFFFFFIf you accept this risk — &#FF5555repeat the same command with the same password within {seconds}s. &#A0FFA0Otherwise type the password in chat (safe) or enable protected mode."
  insecure_confirmed: "{prefix}&#FFFF66Confirmed. Password accepted — remember it is already in the server logs."
  insecure_password_in_logs: "{prefix}&#FF5555&lWARNING! &#FFFFFFYou typed your password in a command — it is now stored in the server console and logs. &#FF5555The server owner can read it. &#FFFFFFChange it: &#A0FFA0/changepassword &#7F7F7F(or set security.secure_password_input: true)"

  # ---------- join / register ----------
  join_need_register: "{prefix}&#FFFFFFYou are not registered yet. Type: &#A0FFA0/reg &#7F7F7F(then your password in chat)"
  join_need_login: "{prefix}&#FFFFFFLogin required: &#A0FFA0/l &#7F7F7F(then your password in chat)"
  join_auto_login: "{prefix}&#A0FFA0Logged in automatically &#7F7F7F(session active, same IP)"
  join_bedrock_auto_login: "{prefix}&#A0FFA0Bedrock auto-login done &#7F7F7F(Floodgate trusted)"
  join_premium_auto_login: "{prefix}&#A0FFA0Premium account verified — no password needed"

  already_logged_in: "{prefix}&#FFFF66You are already logged in."
  already_registered: "{prefix}&#FF6666You are already registered. Use: &#A0FFA0/l"
  not_registered: "{prefix}&#FF6666You are not registered. Use: &#A0FFA0/reg"

  register_success: "{prefix}&#A0FFA0Registered successfully. &#FFFFFFHave fun!"
  login_success: "{prefix}&#A0FFA0Logged in. &#FFFFFFWelcome!"
  wrong_password: "{prefix}&#FF6666Wrong password. &#7F7F7FCheck your keyboard layout / CapsLock: &#A0FFA0/l"
  password_too_short: "{prefix}&#FF6666Password is too short."
  password_too_long: "{prefix}&#FF6666Password is too long."
  password_invalid: "{prefix}&#FF6666Password contains invalid characters or surrounding spaces."
  password_too_weak: "{prefix}&#FF6666Password is too weak. Use mixed characters."
  passwords_dont_match: "{prefix}&#FF6666Passwords do not match. Try again."

  password_in_command_blocked: "{prefix}&#FF6666Do not put your password in a command! &#FFFFFFType only &#A0FFA0/l &#FFFFFFor &#A0FFA0/reg&#FFFFFF, then your password in chat."
  password_input_timeout: "{prefix}&#FF6666Password input timed out. Try again: &#A0FFA0/l"
  password_input_cancelled: "{prefix}&#FFFF66Cancelled."

  blocked_command: "{prefix}&#FF6666Log in first. Allowed: &#A0FFA0/l &#FFFFFFand &#A0FFA0/reg"

  enter_password_chat_login: "{prefix}&#FFFFFFStep 1 done. Step 2: type your password in chat. &#7F7F7F(other players will not see it)"
  enter_password_chat_register: "{prefix}&#FFFFFFStep 1 done. Step 2: invent a password and type it in chat."
  enter_password_chat_confirm: "{prefix}&#FFFFFFType the password again to confirm."
  enter_password_chat_old: "{prefix}&#FFFFFFPassword change: type your CURRENT password in chat. &#7F7F7F(cancel: cancel)"
  enter_password_chat_new: "{prefix}&#FFFFFFNow type your NEW password in chat."

  change_password_success: "{prefix}&#A0FFA0Password changed!"
  change_password_wrong_old: "{prefix}&#FF6666Current password is wrong. Change cancelled."
  change_password_usage: "{prefix}&#FFFFFFUse: &#A0FFA0/changepassword &#7F7F7F— then old and new password in chat"

  reminder_register_actionbar: "{prefix}&#FFFFFFRegister: &#A0FFA0/reg &#7F7F7F(password in chat)"
  reminder_login_actionbar: "{prefix}&#FFFFFFLogin: &#A0FFA0/l &#7F7F7F(password in chat)"
  reminder_register_chat: "{prefix}&#FFFFFFRegister: &#A0FFA0/reg &#7F7F7F→ then password in chat"
  reminder_login_chat: "{prefix}&#FFFFFFLogin: &#A0FFA0/l &#7F7F7F→ then password in chat"

  timeout_kick: "{prefix}&#FF6666Auth timeout ({seconds}s). Rejoin: &#A0FFA0/l"
  too_many_attempts_kick: "{prefix}&#FF6666Too many login attempts. Wait and try again later."

  # ---------- antibot ----------
  antibot_started: "{prefix}&#FFFF66Please wait, bot verification is running… &#7F7F7Ftakes less than a minute"
  antibot_bossbar: "&#FFD500Bot verification… &#FFFFFFstage {stage_num}/{stage_total} &#7F7F7F({seconds}s left)"
  antibot_fall_next: "{prefix}&#A0FFA0Nice! Falls left: &#FFFFFF{blocks}"
  antibot_stage_fall: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total}: &#A0FFA0fall onto the platform ({blocks} times)"
  antibot_stage_camera: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total}: &#A0FFA0rotate your camera any direction — collect a couple of full turns (pauses are OK)"
  antibot_stage_slots: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total}: &#A0FFA0switch your hotbar slot {slots} time(s)"
  antibot_slots_force: "{prefix}&#FFFF66Now scroll your mouse wheel by ONE slot &#7F7F7F(input check)"
  antibot_slots_retry: "{prefix}&#FF6666Not detected. Scroll your wheel one more slot."
  antibot_slots_other: "{prefix}&#FFFF66Switch to a DIFFERENT slot, not the previous one &#7F7F7F(anti-cheat)"
  antibot_stage_captcha: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total}: type the code &#A0FFA0{code}"
  antibot_stage_click: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total}: &#A0FFA0[CLICK HERE] &#7F7F7Fto finish"
  antibot_stage_block: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total}: &#A0FFA0take the tool from the chest, follow the path, break the &#FFD700{block}&#A0FFA0 and pick up the drop"
  antibot_stage_puzzle: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total}: &#A0FFA0take ONLY the starred eggs &#FF6666★ &#A0FFA0— leave the rest. Stage completes automatically."
  antibot_stage_puzzle_blocks: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total}: &#FF6666remove the extras - {targets}&#FFFFFF. Punch the extra picture! Leave the rest alone."
  antibot_puzzle_finish_hint: "{prefix}&#FFFF66Removed all extras? Type in chat: &#FFFFFF{word}"
  antibot_puzzle_removed: "{prefix}&#A0FFA0Removed! Extras left: &#FFFFFF{blocks}"
  antibot_puzzle_countdown: "{prefix}&#FFFF66Checking the puzzle… &#FFFFFF{blocks}&#FFFF66…"
  antibot_fall_void: "{prefix}&#FF6666You fell into the void - check NOT passed! &#FFFFFFRetrying ({blocks} left)"
  antibot_puzzle_wrong: "{prefix}&#FF6666Some extras remain! Left: &#FFFFFF{blocks}&#FF6666. Take only the ★-marked items."
  antibot_puzzle_done: "{prefix}&#A0FFA0Well done! All extras removed — stage passed."
  antibot_speed_button: "{prefix}&#FFFF66Speed II for {blocks} sec — go!"
  antibot_kit_open: "{prefix}&#A0FFA0PvP kit — take the items! (lobby only)"
  antibot_kit_cooldown: "{prefix}&#FF6666Kit is once per {blocks} sec — wait!"
  antibot_puzzle_turn: "{prefix}&#FFD75FTurn around — the puzzle is BEHIND you! Punch the extras."
  chat_slowdown: "{prefix}&#FFAA00Slow down — wait a couple of seconds between messages!"
  chat_ads_blocked: "{prefix}&#FF6666Links and ads are not allowed in chat!"
  chat_too_long: "{prefix}&#FF6666Message is too long!"
  chat_no_repeat: "{prefix}&#FFAA00Don't repeat the same message!"
  antibot_stage_math: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total}: solve and type the answer in chat — &#A0FFA0{expr}"
  antibot_stage_secret: "{prefix}&#FFFFFFCheck {stage_num}/{stage_total} (test {num}/{total}): type exactly — &#A0FFA0{command}"
  antibot_block_fall: "{prefix}&#FF6666You fell off the path! Falls left before kick: &#FFFFFF{blocks}"
  antibot_need_tool: "{prefix}&#FF6666You need the &#FFD700{tool}&#FF6666 from the chest at the path start."
  antibot_wrong_block: "{prefix}&#FF6666Wrong block! Go to the end of the path and break the &#FFD700{block}&#FF6666."
  block_name_COAL_ORE: "coal ore"
  block_name_IRON_ORE: "iron ore"
  block_name_GOLD_ORE: "gold ore"
  block_name_OAK_LOG: "oak log"
  block_name_BIRCH_LOG: "birch log"
  block_name_STONE: "stone"
