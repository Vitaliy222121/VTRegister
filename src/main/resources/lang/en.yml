  tool_name_GOLDEN_AXE: "golden axe"
  tool_name_GOLDEN_SHOVEL: "golden shovel"
  tool_name_SHEARS: "shears"
  block_name_SPRUCE_LOG: "spruce log"
  block_name_DIRT: "dirt"
  block_name_SAND: "sand"
  block_name_GRAVEL: "gravel"
  block_name_COBWEB: "cobweb"
