  block_name_OAK_LEAVES: "oak leaves"
  antibot_fly_kick: "&cFlight detected where flying is not allowed."
  antibot_stage_passed: "{prefix}&#A0FFA0Stage passed"
  antibot_queue: "{prefix}&#7F7F7FVerification queue: position {position}. Please wait…"
  antibot_queue_wait: "{prefix}&#FFFF66Wait for your turn — position &#FFFFFF{position}&#FFFF66, watch the boss bar at the top"
  antibot_queue_full: "&cThe verification queue is full. Try again in a minute."
  antibot_queue_gain: "{prefix}&#A0FFA0PvP kill! You are &#FFFFFF{blocks}&#A0FFA0 positions closer to the check."
  antibot_queue_lose: "{prefix}&#FF6666You died in the PvP zone — moved back &#FFFFFF{blocks}&#FF6666 in queue."
