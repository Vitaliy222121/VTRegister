  antibot_ip_limit: "&cСлишком много подключений с твоего IP. Подожди немного."
  antibot_reconnect: "&eПроверка подключения: зайди ещё раз через пару секунд."
  antibot_multiaccount: "&cС твоего IP уже зарегистрировано максимум аккаунтов."

  # ---------- 2FA ----------
  twofa_enter_code: "{prefix}&#FFFFFFВведи код из приложения-аутентификатора: &#A0FFA0/2fa 123456"
  twofa_wrong_code: "{prefix}&#FF6666Неверный код. Попробуй ещё раз."
  twofa_expired: "{prefix}&#FF6666Время на ввод кода истекло. Войди заново."
  twofa_disabled: "{prefix}&#FF6666Двухфакторная аутентификация выключена на сервере."
  twofa_usage: "{prefix}&#FFFFFF/2fa on — включить, /2fa off — выключить, /2fa <код> — подтвердить"
  twofa_setup: "{prefix}&#FFFFFFОткрой приложение-аутентификатор и добавь секрет ниже, затем введи код: &#A0FFA0/2fa 123456"
  twofa_confirm_hint: "{prefix}&#7F7F7FВведи код из приложения, чтобы включить 2FA"
